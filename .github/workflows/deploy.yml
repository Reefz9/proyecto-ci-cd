name: CD - Despliegue y Rollback

on:
  workflow_dispatch:

jobs:
  deploy-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '26'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn clean verify

      - name: Crear entorno de prueba
        run: |
          mkdir -p deployment/test
          mkdir -p deployment/backup

      - name: Crear versión anterior
        run: |
          cp target/proyecto-ci-cd-1.0-SNAPSHOT.jar deployment/backup/proyecto-ci-cd.jar
          echo "Versión anterior preparada para rollback."

      - name: Desplegar aplicación
        run: |
          cp target/proyecto-ci-cd-1.0-SNAPSHOT.jar deployment/test/proyecto-ci-cd.jar
          echo "Despliegue realizado correctamente."
          ls -lh deployment/test/

      - name: Prueba de aceptación
        run: |
          test -f deployment/test/proyecto-ci-cd.jar
          echo "Prueba de aceptación del despliegue: OK"

      - name: Guardar artefacto desplegado
        uses: actions/upload-artifact@v4
        with:
          name: despliegue-test
          path: deployment/test/proyecto-ci-cd.jar

      - name: Simular fallo para probar rollback
        run: |
          echo "Simulando un fallo controlado después del despliegue..."
          exit 1

      - name: Ejecutar rollback
        if: failure()
        run: |
          cp deployment/backup/proyecto-ci-cd.jar deployment/test/proyecto-ci-cd.jar
          echo "Rollback realizado correctamente."
          echo "Versión anterior restaurada."

      - name: Verificar rollback
        if: failure()
        run: |
          test -f deployment/test/proyecto-ci-cd.jar
          echo "Verificación del rollback: OK"