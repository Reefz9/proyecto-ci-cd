name: CI - Maven

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 26
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '26'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn clean verify

      - name: Guardar JAR generado
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-ci-cd
          path: target/*.jar